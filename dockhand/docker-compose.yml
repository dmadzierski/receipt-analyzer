networks:
  app-network:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - receipt_analyzer_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  keycloak:
    image: keycloak/keycloak:26.3
    container_name: keycloak
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      KC_LOG_LEVEL: info
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_PORT: 3306
      KC_DB_USERNAME: ${MYSQL_USER}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD}
      KC_DB_DATABASE: ${KEYCLOAK_DB}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${HOST_IP}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_SPI_COOKIE_SAMESITE_LEGACY_SAMESITE_VALUE: none
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: 
      localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8091:8080"
    networks:
      - app-network

  nginx:
    image: nginx:1.29.3
    container_name: nginx
    restart: on-failure
    ports:
      - "9002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: [ nginx-debug, '-g', 'daemon off;' ]
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  receipt-analyzer-service:
    image: docker-registry.oziaka.eu/receipt-analyzer-service:latest
    pull_policy: always
    build:
      context: ../receipt-analyzer-service
      dockerfile: ../receipt-analyzer-service/Dockerfile
    container_name: receipt-analyzer-service
    ports:
      - "8090:8090"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      DOCKER_IP: ${DOCKER_IP}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WEB_CLIENT_HOST: ${WEB_CLIENT_HOST}
      LOGGING_LEVEL_ROOT: INFO
      JPA_DDL_AUTO: update
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/activiti/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: https://${HOST_IP}/auth/realms/activiti
      MYSQL_DB_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/receipt-analyzer-service?useSSL=false&serverTimezone=UTC
    depends_on:
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network
    volumes:
      - ./uploads:/app/uploads

  web-client:
    image: docker-registry.oziaka.eu/receipt-analyzer-web-client:latest
    pull_policy: always
    container_name: web-client
    build:
      context: ../web-client
      dockerfile: ../web-client/Dockerfile
    ports:
      - "4200:80"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

volumes:
  receipt_analyzer_mysql_data:
    name: receipt_analyzer_mysql_data
    external: true