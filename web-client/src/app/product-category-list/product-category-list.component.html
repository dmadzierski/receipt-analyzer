<div class="toolbar">
  <h2>Product categories</h2>
</div>

<form (ngSubmit)="addCategory()" class="add-form">
  <mat-form-field class="category-field" subscriptSizing="dynamic">
    <mat-label>Category name</mat-label>
    <input
      [(ngModel)]="newCategoryName"
      matInput
      name="newCategoryName"
      type="text"/>
  </mat-form-field>
  <button color="primary" mat-raised-button type="submit">Add</button>
</form>

<table [dataSource]="dataSource" mat-table>
  <ng-container matColumnDef="name">
    <th *matHeaderCellDef mat-header-cell>Name</th>
    <td *matCellDef="let element" mat-cell>
      @if (editingId === element.id) {
        <input
          [(ngModel)]="element.draftName"
          [ngClass]="{'table-input-editable': editingId === element.id}"
          class="table-input"
          matInput
          name="draftName-{{ element.id }}"
          type="text"/>
      } @else {
        {{ element.name }}
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th *matHeaderCellDef mat-header-cell>Actions</th>
    <td *matCellDef="let element" class="actions" mat-cell>
      @if (editingId === element.id) {
        <button (click)="saveCategory(element)" class="action-button" mat-stroked-button type="button">
          Save
        </button>
        <button (click)="cancelEdit()" class="action-button" mat-stroked-button type="button">
          Cancel
        </button>
      } @else {
        <button (click)="startEdit(element)" class="action-button" mat-stroked-button type="button">
          Edit
        </button>
        <button (click)="deleteCategory(element)" class="action-button action-button-warn" color="warn" mat-stroked-button
                type="button">
          Delete
        </button>
      }
    </td>
  </ng-container>

  <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
  <tr *matRowDef="let row; columns: displayedColumns;" mat-row></tr>
</table>
