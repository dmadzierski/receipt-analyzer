<div class="action-container">
  <a matFab extended class="action-button" routerLink="{{`/wallets/${walletId}/receipts/new`}}">
    <mat-icon color="orange">add_circle</mat-icon>
    Add receipt
  </a>
</div>

<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="position">
    <th mat-header-cell *matHeaderCellDef> No.</th>
    <td mat-cell *matCellDef="let element"> {{ element.position }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name</th>
    <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Description</th>
    <td mat-cell *matCellDef="let element"> {{ element.description }}</td>
  </ng-container>

  <ng-container matColumnDef="createDate">
    <th mat-header-cell *matHeaderCellDef> Create date</th>
    <td mat-cell *matCellDef="let element"> {{ element.createDate }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row (click)="goToDetails(row)" *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
