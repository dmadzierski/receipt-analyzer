@if (revisions) {
  <table mat-table matSort [dataSource]="data" matSortActive="createdDate" matSortDirection="asc" matSortDisableClear>

    <ng-container matColumnDef="selected">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Preferred</th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [checked]="element.id === this.selectedId" [disabled]="false" (click)="changeSelected(element.id)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="resolver">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let element">{{ element.resolver }}</td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Create date</th>
      <td mat-cell *matCellDef="let element">{{ element.createdDate | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Brand</th>
      <td mat-cell *matCellDef="let element">{{ element.brand }}</td>
    </ng-container>

    <ng-container matColumnDef="totalPrice">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Total price</th>
      <td mat-cell *matCellDef="let element">{{ element.totalPrice }}</td>
    </ng-container>

    <ng-container matColumnDef="payingDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Payment date</th>
      <td mat-cell *matCellDef="let element">{{ element.payingDate }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Address</th>
      <td mat-cell *matCellDef="let element">{{ element.address }}</td>
    </ng-container>

    <ng-container matColumnDef="preferredRevision">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Preferred</th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [checked]="element.preferredRevision" [disabled]="true"></mat-checkbox>
      </td>
    </ng-container>


    <ng-container matColumnDef="isCorrect">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Correct</th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [checked]="element.isCorrect" [disabled]="true"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="duplicateRevision(element.id)" title="Utwórz kopię">
          <mat-icon>content_copy</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let _; columns: displayedColumns;"></tr>
  </table>
}
