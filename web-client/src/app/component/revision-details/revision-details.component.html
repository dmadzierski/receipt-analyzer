<div class="content">
  @if (revision) {

    <mat-form-field>
      <mat-label>Brand name</mat-label>
      <input [readonly]="!contentEditable" matInput maxlength="30" [(ngModel)]="revision.brand"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Total price</mat-label>
      <input [readonly]="!contentEditable" matInput maxlength="30" [(ngModel)]="revision.totalPrice"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input [readonly]="!contentEditable" matInput [matDatepicker]="picker" [(ngModel)]="revision.payingDate">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker [disabled]="!contentEditable" #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Address</mat-label>
      <input [readonly]="!contentEditable" matInput maxlength="30" [(ngModel)]="revision.address"/>
    </mat-form-field>

    <h3>Items</h3>

    <table mat-table
           [dataSource]="data"
           matSort
           cdkDropList
           [matSortDisabled]="contentEditable"
           [cdkDropListData]="data.data"
           (cdkDropListDropped)="drop($event)"
           class="mat-elevation-z8">

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> No.</th>
        <td mat-cell *matCellDef="let element">
          <div style="display: flex; align-items: center;">
            @if (contentEditable) {
              <mat-icon
                cdkDragHandle
                style="cursor: grab; margin-right: 8px; color: grey;">
                drag_indicator
              </mat-icon>
            }

            <input matInput class="table-input" [readonly]="true" [value]="element.position"
                   style="width: 30px; text-align: center;">
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
        <td mat-cell *matCellDef="let element">
          <input class="table-input" [(ngModel)]="element.name" [readonly]="!contentEditable"
                 [ngClass]="{'is-editing': contentEditable}"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="ptu">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> PTU</th>
        <td mat-cell *matCellDef="let element">
          <input class="table-input" [(ngModel)]="element.ptu" [readonly]="!contentEditable"
                 [ngClass]="{'is-editing': contentEditable}"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount</th>
        <td mat-cell *matCellDef="let element">
          <input type="number" class="table-input" [(ngModel)]="element.amount" [readonly]="!contentEditable"
                 [ngClass]="{'is-editing': contentEditable}"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="unitPrice">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Unit Price</th>
        <td mat-cell *matCellDef="let element">
          <input type="number" class="table-input" [(ngModel)]="element.unitPrice" [readonly]="!contentEditable"
                 [ngClass]="{'is-editing': contentEditable}"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="totalPrice">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Total Price</th>
        <td mat-cell *matCellDef="let element">
          <input type="number" class="table-input" [(ngModel)]="element.totalPrice" [readonly]="!contentEditable"
                 [ngClass]="{'is-editing': contentEditable}"/>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element; let i = index">
          <div *ngIf="contentEditable" style="display: flex; gap: 5px;">
            <button mat-icon-button color="primary" (click)="addRowAfter(i)">
              <mat-icon>add_circle</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="removeRow(i)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          cdkDrag
          [cdkDragData]="row"
          [cdkDragDisabled]="!contentEditable">

        <div *cdkDragPlaceholder class="custom-placeholder"></div>
      </tr>
    </table>
  }

</div>
