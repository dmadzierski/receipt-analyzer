<div class="content">
  <div class="form-container left-panel">
    <h1>Receipt data</h1>
    <mat-form-field>
      <mat-label>Receipt name</mat-label>
      <input [readonly]="true" matInput maxlength="30" [(ngModel)]="receiptDetails.name"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <input [readonly]="true" matInput maxlength="30" [(ngModel)]="receiptDetails.description"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Create date</mat-label>
      <input [readonly]="true" matInput [matDatepicker]="picker" [(ngModel)]="receiptDetails.createDate">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Update date</mat-label>
      <input [readonly]="true" matInput [matDatepicker]="picker2" [(ngModel)]="receiptDetails.updateDate">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>

    <h2>Revisions</h2>

    <app-revision-list [receiptId]="receiptDetails.id" [revisions]="receiptDetails.revisions"
                       (selectedRevisionChange)="handleSelectedRevisionChange($event)"></app-revision-list>


      @if (this.receiptDetails.preferredRevision) {
        <h2>Revision details
        @if (this.editMode) {
          <mat-icon class="icon" (click)="saveRevision()" fontIcon="save"></mat-icon>
          <mat-icon class="icon" (click)="declineEdit()" fontIcon="cancel"></mat-icon>
        } @else {
          <mat-icon class="icon" (click)="doEdit()" fontIcon="edit"></mat-icon>
<!--          TODO dodać strategy type i ukrywać przycisk dla != USER-->
          <mat-icon class="icon" (click)="refreshAliases()" fontIcon="refresh" matTooltip="Zaktualizacuj słowniki"></mat-icon>
        }
        </h2>
      }


    <app-revision-details [(revision)]="receiptDetails.preferredRevision!!"
                          [contentEditable]="editMode"></app-revision-details>


  </div>
  <div class="right-panel">
    <app-pdf-viewer receiptFileId="{{this.receiptFileId}}"></app-pdf-viewer>
  </div>
</div>
