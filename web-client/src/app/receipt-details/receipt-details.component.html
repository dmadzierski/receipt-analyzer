<div class="form-container">
    <h1>Receipt data</h1>
    <mat-form-field>
        <mat-label>Enter receipt name</mat-label>
        <input matInput maxlength="30" placeholder="Ex. Shopping" [(ngModel)]="receiptDetails.name" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Enter description</mat-label>
        <input matInput maxlength="30" [(ngModel)]="receiptDetails.description" />
    </mat-form-field>



</div>
