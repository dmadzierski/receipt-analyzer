spring:
  application:
    name: receipt-analyzer-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # the schema is owned by Flyway (db/migration); Hibernate only checks that the entities match it
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 80MB
  threads:
    virtual:
      enabled: true

server:
  port: 8090
  servlet:
    context-path: /api

ocr:
  tesseract:
    dataPath: /app/tesseract-data

security:
  web-client-host: ${WEB_CLIENT_HOST}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

receipt-resolver-strategy:
  biedronka:
    version: 1.0
  biedronka-json:
      version: 1.0

product-dict:
  min-required-similarity: 0.8

