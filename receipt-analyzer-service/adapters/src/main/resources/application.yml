spring:
  application:
    name: receipt-analyzer-service
  datasource:
    url: ${MYSQL_DB_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8090
  servlet:
    context-path: /api

ocr:
  tesseract:
    dataPath: /app/tesseract-data

security:
  web-client-host: ${WEB_CLIENT_HOST}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

receipt-resolver-strategy:
  biedronka:
    version: 1.0
  biedronka-json:
      version: 1.0

pdf-service:
  tmp-dir: /app/pdf-service-tmp

product-dict:
  min-required-similarity: 0.8