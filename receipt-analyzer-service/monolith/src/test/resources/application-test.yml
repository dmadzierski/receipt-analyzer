spring:
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/auth/realms/test
          jwk-set-uri: http://localhost/auth/realms/test/protocol/openid-connect/certs

ocr:
  tesseract:
    dataPath: ../tesseract-data

read-model:
  resubmission:
    enabled: false
  listener:
    enabled: false
  rebuild-on-start: false
  consistency-timeout: PT1S
