spring:
  application:
    name: receipt-analyzer-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/receipt-analyzer-service?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/activiti}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://host.docker.internal/auth/realms/activiti/protocol/openid-connect/certs}
#          client-id: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_ID}
#          client-secret: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_TOKEN}
#      client:
#        registration:
#          keycloak:
#            client-id: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_ID}
#            client-secret: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_TOKEN}
#            authorization-grant-type: authorization_code
#            scope: openid
#        provider:
#          keycloak:
#            issuer-uri: ${KEYCLOAK_ISSUER_URI}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8090
  servlet:
    context-path: /api

ocr:
  tesseract:
    dataPath: /app/tesseract-data

security:
  web-client-host: ${WEB_CLIENT_HOST}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:DEBUG}

receipt-resolver-strategy:
  biedronka:
    version: 1.0

pdf-service:
  tmp-dir: /app/pdf-service-tmp