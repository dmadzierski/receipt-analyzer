spring:
  application:
    name: receipt-analyzer-service
  datasource:
    url: jdbc:mysql://${DOCKER_IP}:3306/receipt-analyzer-service?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: receipt-analyzer
            client-secret: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_TOKEN}
            scope: openid, profile, email
            redirect-uri: http://localhost/api/me
            authorization-grant-type: authorization_code
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8081/auth/realms/activiti
            user-name-attribute: preferred_username

server:
  port: 8090
  servlet:
    context-path: /api
