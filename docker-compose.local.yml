networks:
  app-network:

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - receipt_analyzer_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  keycloak:
    image: keycloak/keycloak:26.3
    container_name: keycloak
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_LOG_LEVEL_ORG_KEYCLOAK: ALL
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://${HOST_IP}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HOSTNAME_STRICT_HTTP: true
      KC_HTTP_ENABLED: true
      KC_PROXY: EDGE
      KC_SPI_COOKIE_SAMESITE_LEGACY_SAMESITE_VALUE: none
      #      LOGGING_LEVEL_ROOT: INFO
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm
    volumes:
      - ./dev/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: 
      localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8080"
    networks:
      - app-network

  nginx:
    image: nginx:1.29.3
    container_name: nginx
    restart: on-failure
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: [ nginx-debug, '-g', 'daemon off;' ]
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  receipt-analyzer-service:
    image: docker-registry.oziaka.eu/receipt-analyzer-service:latest
    build:
      context: ./receipt-analyzer-service
      dockerfile: Dockerfile
    container_name: receipt-analyzer-service
    ports:
      - "8090:8090"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      DOCKER_IP: $(DOCKER_IP)
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WEB_CLIENT_HOST: ${WEB_CLIENT_HOST}
      LOGGING_LEVEL_ROOT: INFO
      JPA_DDL_AUTO: validate
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal/auth/realms/activiti/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://host.docker.internal/auth/realms/activiti
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/receipt-analyzer-service?reWriteBatchedInserts=true
    depends_on:
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -T5 -qO- http://localhost:8090/api/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  receipt_analyzer_postgres_data: