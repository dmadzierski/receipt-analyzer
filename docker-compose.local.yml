networks:
  app-network:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - receipt_analyzer_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 5s
      timeout: 1s
      retries: 20
    networks:
      - app-network

  keycloak:
    image: keycloak/keycloak:26.3
    container_name: keycloak
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      KC_LOG_LEVEL_ORG_KEYCLOAK: ALL
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_PORT: 3306
      KC_DB_USERNAME: ${MYSQL_USER}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD}
      KC_DB_DATABASE: ${KEYCLOAK_DB}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://${HOST_IP}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HOSTNAME_STRICT_HTTP: true
      KC_HTTP_ENABLED: true
      KC_PROXY: EDGE
      KC_SPI_COOKIE_SAMESITE_LEGACY_SAMESITE_VALUE: none
      #      LOGGING_LEVEL_ROOT: INFO
      KC_HEALTH_ENABLED: true
    command: start-dev
    healthcheck:
      test: [ "CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8081:8080"
    networks:
      - app-network

  nginx:
    image: nginx:1.29.3
    container_name: nginx
    restart: on-failure
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: [ nginx-debug, '-g', 'daemon off;' ]
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  receipt-analyzer-service:
    build:
      context: ./receipt-analyzer-service
      dockerfile: Dockerfile
    container_name: receipt-analyzer-service
    ports:
      - "8090:8090"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      RECEIPT_ANALYZER_KEYCLOAK_CLIENT_TOKEN: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_TOKEN}
      RECEIPT_ANALYZER_KEYCLOAK_CLIENT_ID: ${RECEIPT_ANALYZER_KEYCLOAK_CLIENT_ID}
      DOCKER_IP: $(DOCKER_IP)
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WEB_CLIENT_HOST: ${WEB_CLIENT_HOST}
      LOGGING_LEVEL_ROOT: INFO
      JPA_DDL_AUTO: update
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal/auth/realms/activiti/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost/auth/realms/activiti
      MYSQL_DB_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/receipt-analyzer-service?useSSL=false&serverTimezone=UTC
    depends_on:
      keycloak:
        condition: service_healthy
      nginx:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  receipt_analyzer_mysql_data: